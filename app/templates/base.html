<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Capping de leyes · Proyecto Aurora{% endblock %}</title>
  <style>
    :root {
      --azul: #1F3A5F;
      --azul-claro: #2C5282;
      --dorado: #C9A227;
      --fondo: #F5F7FA;
      --texto: #1A202C;
      --gris: #5A6474;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--azul);
      color: #fff;
      border-bottom: 4px solid var(--dorado);
    }
    .contenedor { max-width: 1100px; margin: 0 auto; padding: 0 1.25rem; }
    header .contenedor {
      display: flex; align-items: center; justify-content: space-between;
      height: 64px;
    }
    .marca { font-weight: 600; font-size: 1.1rem; letter-spacing: .02em; color: #fff; text-decoration: none; }
    .marca span { color: var(--dorado); }
    nav a { color: #E2E8F0; text-decoration: none; margin-left: 1.25rem; font-size: .95rem; }
    nav a:hover { color: var(--dorado); }
    main { flex: 1; padding: 2.5rem 0; }
    h1 { color: var(--azul); margin-top: 0; }
    .flash { padding: .75rem 1rem; border-radius: 4px; margin-bottom: 1rem; border-left: 4px solid; }
    .flash.ok { background: #F0FFF4; border-color: #2F855A; color: #22543D; }
    .flash.error { background: #FFF5F5; border-color: #C53030; color: #742A2A; }
    footer {
      background: var(--azul);
      color: #CBD5E0;
      font-size: .85rem;
      padding: 1rem 0;
      text-align: center;
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <div class="contenedor">
      <a class="marca" href="{{ url_for('main.index') }}">Proyecto <span>Aurora</span></a>
      <nav>
        <a href="{{ url_for('main.index') }}">Inicio</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="contenedor">
      {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensaje in mensajes %}<div class="flash {{ categoria }}" role="status">{{ mensaje }}</div>{% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
  </main>
  <footer>
    <div class="contenedor">capping_web · Proyecto Aurora</div>
  </footer>
</body>
</html>
